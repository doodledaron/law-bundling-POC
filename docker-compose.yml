      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - WORKER_TYPE=maintenance
      - CELERY_WORKER_QUEUES=maintenance
    depends_on:
      - redis
    restart: unless-stopped
    # No GPU needed for maintenance tasks
    mem_limit: 512m # Much lower memory for maintenance tasks
    memswap_limit: 512m
    shm_size: 128m
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m

