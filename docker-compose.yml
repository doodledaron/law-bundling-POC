services:
  # Web API service running FastAPI
  api:
    build:
      context: .
      dockerfile: Dockerfile.lite # Use lightweight image
    container_name: law-api
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload # Start FastAPI with auto-reload
    volumes:
      - .:/app # Mount the local directory into the container
      - uploads_data:/app/uploads
      - results_data:/app/results
    ports:
      - "8000:8000" # Map port 8000 on the host to port 8000 in the container
    environment:
      - PYTHONUNBUFFERED=1 # Ensure logs are shown in real-time
      - REDIS_URL=redis://redis:6379/0 # Redis connection URL
    depends_on:
      - redis # Ensure Redis is started before this service
    restart: unless-stopped # Restart the service unless it is manually stopped
    # No GPU needed for API service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"] # Check API health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis service acting as the message broker and result backend for Celery
  redis:
    image: redis:7-alpine # Use more current Redis image
    container_name: law-redis
    ports:
      - "6379:6379" # Expose Redis port
    command: redis-server --save "" --appendonly no --loglevel warning --maxmemory 24gb --maxmemory-policy allkeys-lru --maxmemory-samples 10 --lazyfree-lazy-eviction yes --tcp-keepalive 60 --timeout 0 --replicaof no one # Stability-focused Redis config - replicaof ensures master mode
    volumes:
      - redis-data:/data # Persist Redis data across restarts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"] # Ensure Redis is running
      interval: 30s
      timeout: 10s
      retries: 3

  # Container 1: Document processing worker with intelligent load balancing
  worker-documents-container1:
    build: . # Use the same Dockerfile as other services (HEAVY PaddlePaddle image)
    container_name: law-worker-documents-container1
    command: >
      sh -c "
        echo 'Waiting for Redis to be ready...' &&
        sleep 10 &&
        echo 'Setting up shared directories...' &&
        chmod -R 777 /app/uploads /app/results /app/chunks &&
        echo 'Installing high-performance inference plugin...' &&
        pip install --no-cache-dir fastdeploy-gpu-python --quiet || echo 'FastDeploy GPU install failed' &&
        echo 'Starting Document Processing Container 1...' &&
        celery -A celery_config worker -Q chunk_queue,merge_queue -l info --concurrency=2 --hostname=worker-documents-container1@%h
      "
    volumes:
      - .:/app
      - uploads_data:/app/uploads
      - results_data:/app/results
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - WORKER_TYPE=documents
      - CELERY_WORKER_QUEUES=chunk_queue
      - CONTAINER_ID=container1
      # TensorRT/hpip stability settings
      - TRT_MAX_WORKSPACE_SIZE=268435456 # 256MB limit
      - CUDA_LAUNCH_BLOCKING=1 # Force synchronous operations
      - TRT_PRECISION_MODE=fp16 # Use FP16 for stability
      - CUDA_DEVICE_ORDER=PCI_BUS_ID # Consistent device ordering
      - FLAGS_allocator_strategy=auto_growth # Safe memory allocation
      - FLAGS_use_fast_allocator=true # Better memory management
      # Memory protection settings
      - MALLOC_CHECK_=1 # Enable memory corruption detection
      - MALLOC_PERTURB_=255 # Initialize freed memory to detect use-after-free
      - PYTHONMALLOC=malloc # Use system malloc for better debugging
    depends_on:
      - redis
    restart: unless-stopped
    # GPU support - uncomment for Linux machines with NVIDIA GPUs
    gpus: all
    # Optimized memory allocation for 6-container setup (5GB per container)
    mem_limit: 9g # Memory limit as specified for high-throughput processing
    memswap_limit: 9g # Match memory limit
    shm_size: 2g # Shared memory for CUDA operations
    deploy:
      resources:
        limits:
          memory: 9g
        reservations:
          memory: 2g
          # GPU device reservation - uncomment for Linux machines with NVIDIA GPUs
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

