      - "5555:5555" # Expose Flower dashboard
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    env_file:
      - .env
    depends_on:
      - redis
      - worker-documents-container1 # Ensure container 1 is running
      - worker-documents-container2 # Ensure container 2 is running
